name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 26.04 no longer has a Python 3.9 toolchain.
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile
        run: python -m py_compile mpv_ambilight.py webui.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check the Lua script parses
        if: matrix.python-version == '3.11'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          lua5.4 -e 'assert(loadfile("lua/wiz_ambilight.lua"))'
